[agent]
model = "groq/llama-3.3-70b-versatile"
fallback = ["openai/gpt-4o-mini"]
iteration_budget = 500
temperature = 0.2
system_prompt = ""
skills = ["antislop"]
context_tokens = 32000

[auxiliary]
model = ""
fallback = []

[learning]
mode = "ask"
lessons_in_prompt = 5
max_lessons = 500
skills = false

[memory]
enabled = true
max_memories = 2000
retention_days = 0
max_content_chars = 500

[permissions]
mode = "ask"
workspace = "."

[logging]
level = "INFO"
file = ""
json = false

[network]
timeout_seconds = 120.0
max_retries = 3
local_only = false
cooldown_seconds = 30.0
max_cooldown_seconds = 300.0
retry_jitter = 0.0
first_token_seconds = 0.0

[tools]
max_output_chars = 20000
timeout_seconds = 120.0
max_parallel_tools = 4

[sandbox]
backend = "container"
runtime = "docker"
image = "python:3.12-alpine"
required = true
network = false
memory_mb = 1024
cpu_limit = 1.0
pids_limit = 128
# auto maps the host uid:gid into the container (falls back to 1000:1000
# when eurus itself runs as root); a fixed value like "1000:1000" or a
# name like "nobody" is passed to docker --user verbatim.
user = "auto"
# When non-empty, the configured image must match one of these references.
# image_allowlist = ["python:3.12-alpine", "docker.io/library/alpine:3.20"]
# Require name@sha256:<digest> references instead of mutable tags.
digest_pin_required = false
# "" uses the Docker default seccomp profile; "default" installs the
# bundled hardened allowlist into <home>/system/docker/; or give a path
# to your own profile JSON.
seccomp_profile = ""
# Optional AppArmor profile name applied via --security-opt (where supported).
apparmor_profile = ""

[browser]
enabled = false
# auto | cdp | playwright | remote | attach
# auto picks cdp on Termux, playwright elsewhere (cdp fallback)
backend = "auto"
# cdp_endpoint = "http://127.0.0.1:9222"   # required for remote/attach
# chromium_executable = "/usr/bin/chromium" # auto-detected when empty
# profile_dir = ""                          # default: ~/.eurus/browser/profile
headless = true
max_page_bytes = 2000000
navigation_timeout_seconds = 30.0
interaction_timeout_seconds = 10.0
startup_timeout_seconds = 25.0
max_screenshot_width = 1280
max_screenshot_height = 800
max_snapshot_tokens = 3000
allowed_domains = []
blocked_domains = []
download_dir = ""
max_download_mb = 50
dns_cache_ttl_seconds = 60.0
max_sessions = 3
session_idle_ttl_seconds = 900.0
