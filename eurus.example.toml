[agent]
model = "groq/llama-3.3-70b-versatile"
fallback = ["openai/gpt-4o-mini"]
iteration_budget = 500
temperature = 0.2
system_prompt = ""
skills = ["antislop"]
context_tokens = 32000

[auxiliary]
model = ""
fallback = []

[learning]
mode = "ask"
lessons_in_prompt = 5
max_lessons = 500
skills = false

[memory]
enabled = true
max_memories = 2000
retention_days = 0
max_content_chars = 500

[permissions]
mode = "ask"
workspace = "."

[logging]
level = "INFO"
file = ""
json = false

[network]
timeout_seconds = 120.0
max_retries = 3
local_only = false
cooldown_seconds = 30.0
max_cooldown_seconds = 300.0
retry_jitter = 0.0
first_token_seconds = 0.0

[tools]
max_output_chars = 20000
timeout_seconds = 120.0
max_parallel_tools = 4

[sandbox]
backend = "container"
runtime = "docker"
image = "python:3.12-alpine"
required = true
network = false
memory_mb = 1024
cpu_limit = 1.0
pids_limit = 128
