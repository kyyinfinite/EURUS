[agent]
model = "groq/llama-3.3-70b-versatile"
fallback = ["openai/gpt-4o-mini"]
iteration_budget = 500
temperature = 0.2
system_prompt = ""
skills = ["antislop"]
context_tokens = 32000

[auxiliary]
model = ""
fallback = []

[learning]
mode = "ask"
lessons_in_prompt = 5
max_lessons = 500
skills = false

[memory]
enabled = true
max_memories = 2000
retention_days = 0
max_content_chars = 500

[permissions]
mode = "ask"
workspace = "."

[logging]
level = "INFO"
file = ""
json = false

[network]
timeout_seconds = 120.0
max_retries = 3
local_only = false
cooldown_seconds = 30.0
max_cooldown_seconds = 300.0
retry_jitter = 0.0
first_token_seconds = 0.0

[tools]
max_output_chars = 20000
timeout_seconds = 120.0
max_parallel_tools = 4

[sandbox]
backend = "container"
runtime = "docker"
image = "python:3.12-alpine"
required = true
network = false
memory_mb = 1024
cpu_limit = 1.0
pids_limit = 128
user = "auto"
digest_pin_required = false
seccomp_profile = ""
apparmor_profile = ""

[office]
enabled = true
max_revision_cycles = 3
max_model_calls = 60
max_workers = 3
deadline_seconds = 1800.0
tool_timeout_seconds = 1800.0
content_score_min = 85.0
visual_score_min = 85.0
structural_score_min = 95.0
allow_research_delegation = true

[browser]
enabled = false
backend = "auto"
headless = true
max_page_bytes = 2000000
navigation_timeout_seconds = 30.0
interaction_timeout_seconds = 10.0
startup_timeout_seconds = 25.0
max_screenshot_width = 1280
max_screenshot_height = 800
max_snapshot_tokens = 3000
allowed_domains = []
blocked_domains = []
download_dir = ""
max_download_mb = 50
dns_cache_ttl_seconds = 60.0
max_sessions = 3
session_idle_ttl_seconds = 900.0

[research]
enabled = true
default_mode = "standard"
providers = ["ddgs"]
provider_timeout_seconds = 20.0
provider_retries = 1
fetch_timeout_seconds = 15.0
max_fetch_mb = 2
max_content_chars = 12000
deep_max_rounds = 3
deep_max_queries = 12
deep_max_sources = 16
deep_max_fetches = 10
deep_deadline_seconds = 240.0
deep_coverage_target = 0.8
browser_fallback = true
browser_fetch_budget = 2
cache_ttl_seconds = 900.0
cache_max_entries = 256
job_retention_days = 30

[autonomy]
enabled = true
workers = 2
poll_seconds = 15.0
goals = true
workflows = true
events = true
specialists = true
learning = true
daily_job_limit = 50
pre_script_timeout_seconds = 30.0
delegate_max_batch = 4
delegate_max_iterations = 20
delegate_deadline_seconds = 600.0

[audio]
stt_model = ""
stt_language = ""
stt_timeout_seconds = 180.0
tts_model = ""
tts_voice = "alloy"
tts_format = "mp3"
tts_timeout_seconds = 120.0
realtime_model = ""
realtime_voice = "alloy"
realtime_session_seconds = 300.0
realtime_timeout_seconds = 30.0

[generation]
image_model = ""
image_size = ""
image_timeout_seconds = 180.0
video_model = ""
video_aspect_ratio = "16:9"
video_timeout_seconds = 900.0
video_poll_interval_seconds = 10.0
video_job_wait_seconds = 120.0
max_outputs_per_request = 4
