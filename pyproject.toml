[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "eurus-agent"
dynamic = ["version"]
description = "Eurus: provider-agnostic AI coding agent that works your shell, files, skills and MCP tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ripki Dwi Putra" }]
keywords = ["ai", "agent", "llm", "coding-agent", "cli", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "httpx>=0.27,<1",
    "httpcore>=1.0,<2",
    "click>=8.1",
    "rich>=13.7",
    "pygments>=2.17",
    "prompt_toolkit>=3.0.43",
    "tzdata>=2025.2",
    "mcp>=1.27,<2",
]

[project.optional-dependencies]
web = ["ddgs>=9.14.0", "trafilatura>=2.2.0"]
groq = ["groq>=0.13"]
genai = ["google-genai>=1.0"]
sdk = ["groq>=0.13", "google-genai>=1.0"]
mcp = ["mcp>=1.27,<2"]
google = ["keyring>=25", "cryptography>=42"]
telegram = ["aiogram>=3.29,<4"]
browser = ["playwright>=1.50"]
browser-cdp = ["websockets>=12"]
documents = ["python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.18.2",
    "aiogram>=3.29,<4",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "ddgs>=9.14.0",
    "trafilatura>=2.2.0",
    "keyring>=25",
    "cryptography>=42",
]

[project.scripts]
eurus = "eurus.cli:main"
eurus-tui = "eurus.cli:agent_main"

[tool.hatch.version]
path = "src/eurus/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/eurus"]
# Ship the (user-populated) bundled font folder even when ignore rules would skip it.
artifacts = ["src/eurus/tui/assets/fonts/.gitkeep", "src/eurus/tui/assets/fonts/*.ttf", "src/eurus/tui/assets/fonts/*.otf"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/eurus/coding/office_tools.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
faulthandler_timeout = 120
markers = [
    "browser_integration: tests that launch a real Chromium (skipped when unavailable)",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mcp", "mcp.*", "aiogram", "aiogram.*", "pptx", "pptx.*", "trafilatura", "ddgs", "playwright", "playwright.*", "websockets", "websockets.*", "keyring", "keyring.*", "cryptography", "cryptography.*", "uvicorn", "uvicorn.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "eurus.gateway.telegram.*"
disallow_untyped_decorators = false


[[tool.mypy.overrides]]
module = "eurus.gateway.telegram.approval"
follow_imports = "skip"
